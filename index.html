<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fylo Data Storage</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <main>
            <div class="flex-container">
                <div class="box1">
                    <img src="./images/logo.svg"
                             alt="The logo of the company Fylo"
                             class="logo">
                    <div class="icons-container">
                        <img src="./images/icon-document.svg" 
                             alt="the document icon"
                             class="document">
                        <img src="./images/icon-folder.svg" 
                             alt="the folder icon"
                             class="folder">
                        <img src="./images/icon-upload.svg" 
                             alt="the upload icon"
                             class="upload">
                    </div>
                </div>
                <div class="box2">
                    <p class="remaining-storage">You’ve used <span class="color">815 GB</span> of your storage</p>
                    <div class="progress-bar"> <!--La bar avec le background de fond-->
                        <div class="bar"></div> <!--La bar qui progresse-->
                    </div>
                    <div class="values">
                            <p class="value-minimum">0 GB</p>
                            <p class="value-maximum">1000 GB</p>
                    </div>
                    <div class="mini-box">
                        <p><span class="remain-storage">185</span> GB LEFT</p>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
